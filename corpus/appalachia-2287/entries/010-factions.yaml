# Survivor factions in Appalachia after the Great War.
#
# `subject` is the exact canonical name: it is to be used as it is, never
# translated, never reworded, never replaced with an invented synonym.
# If a proper name is not in this file, the narrator does not use it: it does not
# guess.
#
# `status` reflects the Status column of the reference listing:
#   Active   -> `active`
#   Restarted-> `active` + note: the faction dissolved and reappeared
#   Defunct  -> `retconned` (dissolved; it is only named in the past)
#
  # Note: for People's Liberation Army the listing gives no status.
# It is not deduced: the entry stays with no stated state.
#
# RELIABILITY SCOPE
# From that listing only the following are verified: the canonical name and the
# status. Descriptions, chiefs, bases and slogans are not taken from the
# consulted reference and were kept only where verifiable elsewhere.
# Everything else is marked "unverified: do not invent".
# If a detail is needed that is missing here, it must be looked up and added
# once verified: not deduced.

entries:
  - subject: "Responders"
    kind: faction
    era: "2287"
    status: active
    priority: 100
    aliases: ["i Responders"]
    summary: >-
      Survivors who reorganised after the crisis that hit them and were then
      reformed: the listing classifies them as restarted.
    facts:
      - "Listed status: Restarted, that is dissolved and then reassembled."
      - "They are among the factions named by the survivors of Morganthown and around."

  - subject: "Brotherhood of Steel"
    kind: faction
    era: "2287"
    status: retconned
    priority: 100
    summary: >-
      Technological military order present in Appalachia. The listing gives it
      as dissolved: it exists in the history of the world, not as an active force.
    facts:
      - "Listed status: Defunct."
      - "The Appalachia chapter was dissolved; the surviving men went away."
      - "The name is to be used only when speaking of the past or of local history."

  - subject: "Brotherhood First Expeditionary Force"
    kind: faction
    era: "2287"
    status: active
    priority: 85
    summary: >-
      Expedition of the Brotherhood of Steel that arrived in Appalachia after the
      local chapter disappeared.
    facts:
      - "Listed status: Active."
      - "It came from the east and brings technologies Appalachia had not seen for years."

  - subject: "Brotherhood of Zeal"
    kind: faction
    era: "2287"
    status: active
    priority: 60
    summary: >-
      Group of devotees that follows the doctrine of the Brotherhood of Steel in a
      stricter and more devoted way.
    facts:
      - "Listed status: Active."

  - subject: "Enclave"
    kind: faction
    era: "2287"
    status: retconned
    priority: 85
    summary: >-
      The Continuity military government. The listing gives it as dissolved; its
      places and its technological legacy remain.
    facts:
      - "Listed status: Defunct."
      - "There is no active garrison any more, but its infrastructure is still standing."

  - subject: "Free States"
    kind: faction
    era: "2287"
    status: retconned
    priority: 90
    summary: >-
      Community founded at Harpers Ferry that wanted to decide for itself, closed
      and distrustful. The listing gives it as dissolved.
    facts:
      - "Listed status: Defunct."
      - "They had an army of their own: the Secret Service."
      - "Naming them today means speaking about them in the past."

  - subject: "Secret Service"
    kind: faction
    era: "2287"
    status: active
    priority: 75
    summary: >-
      Armed force of the Free States. The listing gives them as active, and the
      places where they operated still exist.
    facts:
      - "Listed status: Active."
      - "Do not confuse them with the Responders: it is a distinct faction."
      - "They have an office of their own, the Secret Service Office."

  - subject: "Cult of the Mothman"
    kind: faction
    era: "2287"
    status: active
    priority: 90
    summary: >-
      Pre-war cult dedicated to the Mothman. It still has a museum and a valley
      where it lives.
    facts:
      - "Listed status: Active."
      - "They have the Mothman Museum and a base in the Kanawha valley."
      - "They are not hostile to whoever arrives in peace."

  - subject: "The Enlightened"
    kind: faction
    era: "2287"
    status: active
    priority: 65
    summary: "Separate sect that venerates the Mothman Wise, the one with the purple eyes."
    facts:
      - "Listed status: Active."
      - "Do not confuse it with the main body of the Cult of the Mothman."

  - subject: "Raiders"
    kind: faction
    era: "2287"
    status: retconned
    priority: 85
    summary: >-
      Bands from the mountains, divided into groups with names of their own. The
      listing gives them as dissolved, because their human members have been
      wiped out.
    facts:
      - "Listed status: Defunct."
      - "They had several groups with a name of their own: some are listed here, others are not."
      - "Last base: Top of the World."
      - "Their fate after the return is told by the Crater Raiders."
      - "Complete list of the groups and their chiefs unverified: do not invent."

  - subject: "Cutthroats"
    kind: faction
    era: "2287"
    status: retconned
    priority: 55
    summary: "One of the five groups of the Raiders. Dissolved with the rest of the band."
    facts:
