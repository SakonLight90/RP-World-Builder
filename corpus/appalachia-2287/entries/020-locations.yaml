      - "It contains the Sunnytop ski station."

  - subject: "Burning Springs"
    kind: location
    era: "2287"
    priority: 80
    summary: "Mining town destroyed by the bombs, today an area of ruins."
    facts:
      - "Mining town of Appalachia, destroyed in the 2077 explosion."
      - "Today it is an area of ruins and enemies."

  - subject: "The Crater"
    kind: location
    era: "2287"
    priority: 95
    summary: >-
      Crater formed by the impact of a re-entry capsule, in the centre of the
      region. It contains the Valiant-1 station, today the base of the Crater
      Raiders.
    facts:
      - "Impact crater in the centre of Appalachia."
      - "In the centre there is the Valiant-1 space station, base of the Crater Raiders."
      - "Inside there are The Core and the Crater War Room."
      - "The gates are controlled by the Hellcat Company."

