# Regions and locations of Appalachia, with the **exact** name.
#
# Note: the Italian adjectives that appear here inside the `aliases` field are
# only shortcuts for spoken Italian. The narrator must use `subject` exactly as
# it is. "The Mire" does not become "la Palude" as a proper name: if it needs to
# say "la palude", it says it around the name.
#
# This is a curated subset of ~55 main locations out of the ~700 present in the
# listing. The others exist but have not been verified here: the narrator must
# not name them until they are added.
#
# RELIABILITY SCOPE
# From the consulted listing only the canonical names are verified.
# Descriptions, garrisons and the links between locations are reconstructions and
# hold until they are checked: where they are not certain it says
# "unverified: do not invent".
# The name, on the other hand, is reliable and is to be used literally.

entries:
  - subject: "Appalachia"
    kind: location
    era: "2287"
    priority: 100
    summary: >-
      The mountainous region of the north-east of America in which the whole
      story of Fallout 76 takes place. In this corpus the term means the game
      territory, not the real state.
    facts:
      - "Region at the far eastern end of the United States, destroyed by the Great War."
      - "It is the territory of Fallout 76, not a generic word for 'territory'."
      - "It borders the real West Virginia, which the game takes its name from."

  - subject: "The Ash Heap"
    kind: location
    era: "2287"
    priority: 90
    aliases: ["Ash Heap"]
    summary: >-
      Territory covered by a fall of radioactive particles dropped during the war.
      Whoever stays inside it turns into a Scorched.
    facts:
      - "Most dangerous area of the region, saturated with radiation."
      - "The surviving inhabitants have become Scorched."
      - "The canonical name is The Ash Heap; Ash Heap is the short form."

  - subject: "Cranberry Bog"
    kind: location
    era: "2287"
    priority: 85
    summary: "Red bog of Appalachia, saturated with radioactive blueberry bushes."
    facts:
      - "Bog of Appalachia, rich in radioactive vegetation."
      - "In the bog there are abandoned plantations and lost settlements."

  - subject: "The Forest"
    kind: location
    era: "2287"
    priority: 85
    summary: "Thick fog of Appalachia, territory of the Pioneer Scout kids."
    facts:
      - "Dense forest in the centre of the map."
      - "It is the territory of the Pioneer Scouts and of their scattered camps."

  - subject: "The Mire"
    kind: location
    era: "2287"
    priority: 85
    summary: "Marshy and unhealthy area south of Appalachia."
    facts:
      - "Unhealthy bog of southern Appalachia."
      - "Description and garrisons not verified yet: do not invent."

  - subject: "Savage Divide"
    kind: location
    era: "2287"
    priority: 85
    summary: "Mountain range beyond which the survivors of the east did not pass willingly."
    facts:
      - "Mountainous divide on the east side of the map."
      - "Passage point towards the east of the region."

  - subject: "Toxic Valley"
    kind: location
    era: "2287"
    priority: 85
    summary: "Valley into which the toxic waste of the region is discharged."
    facts:
      - "Polluted industrial area, interconnected with the pipes and structures of the Crater."
      - "In the valley there are numerous abandoned factories."

  - subject: "Skyline Valley"
    kind: location
    era: "2287"
    priority: 85
    summary: "Mountain valley crossed by the Skyline Drive."
    facts:
