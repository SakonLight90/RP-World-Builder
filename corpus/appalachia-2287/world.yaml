name: Fallout
slug: appalachia-2287
description: >-
  The Fallout timeline, from the Great War to the present. A world of survivors
  rebuilding a fragmented civilisation among ruins, forgotten technology and
  creatures the war transformed.
baseLocale: it
isTemplate: true
templateAuthor: "0x1994"

activeEras:
  - "2287"

# Libraries this world requires, not libraries it contains.
#
# The lore of every Fallout game lives in `lore/fallout`, read-only and shared:
# this world does not contain it, it requires it. The narrator reads it with its
# read tools when the player names a place or a faction, instead of carrying it
# in every prompt.
#
# `hash` is the fingerprint of the content at the moment of the requirement. If
# the library changes and this world does not, validation says so: it is how you
# find out that the campaign is describing a different version of its content.
libraries:
  - id: fallout
    version: "1.0.0"
    hash: "sha256:fa32d54d3d671d64463c5f60a55ac6ab6455c5c81095fc7d17f73b77f38e8070"

eras:
  - key: pre-war
    label: "Before the war (2052-2077)"
    startYear: 2052
    endYear: 2077
    summary: >-
      Vault societies help America recover from the energy and environmental
      crisis. It is the era of the Cold War, the arms race and the corporations
      fighting over the control of resources.
  - key: post-war
    label: "After the war (2077-2286)"
    startYear: 2077
    endYear: 2286
    summary: >-
      The bombs fall, the Old World collapses and the rebuilding begins. For
      more than two centuries survival is the dominant problem: the megastructures
      are still standing, but almost nobody knows how to use them yet.
  - key: "2287"
    label: "Appalachia 2287"
    startYear: 2287
    summary: >-
      The era of the game. The vaults start opening their doors again, factions
      fight over territory and humanity begins to remember what the world used
      to be.

bible:
  premise: >-
    You are a survivor of Appalachia, two hundred and ten years after the war
    that wiped out the Old World. The vault dwellers came out to restore order
    to a continent that stopped working, and the search for a lasting solution
    is the reason you exist in this story.

  rules: >-
    This world has no magic, and nothing that works like magic. No spell, no
    psychic power, no being made supernatural by mystic means. What happens to
    the protagonists happens through mechanics, through technology, through
    biology altered by radiation, or through human choices.

    The technology that exists is that of the 2040s plus a few pre-war rarities.
    It works, but it is rare, expensive to maintain and almost always damaged.
    Energy weapons and advanced technologies exist on paper and in display cases,
    not in everyday life.

    Survival is the central problem: food, clean water, medicine and ammunition
    are scarce. Whoever has weapons, water and information has power, and
    whoever has nothing is at the mercy of the others. No character is omnipotent.

    Appalachia is contested territory. Different factions have different
    interests and do not ally stably: when two groups meet, the outcome depends
    on who needs what and who is better armed.

  tone: >-
    Grounded, realistic post-apocalyptic. Hope exists but is earned, never
    guaranteed. Danger is concrete and has consequences. Humour exists and is
    often bitter, but it never undercuts the gravity of the situation.

  style: >-
    Narrate in the third person, with concrete, sensory descriptions: sounds,
    smells, temperatures, materials. Avoid encyclopedic exposition: if a
    character knows a fact, they say it in dialogue, not in a narrator's voice
    that explains.

    Do not describe the player character's feelings. Describe what they see, hear
    and undergo, and leave it to them to decide what they feel.

    Close every turn with an open situation that invites a decision, without
    choosing in the player's place.

  conventions: >-
    Canon proper nouns are not translated and not localised: if the canon says
    "Vault 12", you write "Vault 12", even in Italian.

    Distances are real and Appalachia is big: moving between two settlements
    means time, resources and concrete dangers, not a change of scene.

    Technology is never convenient where it should be. A device that works in a
    laboratory may not work in the field, and repairing it costs more than
    replacing it.

# The ways into this world. Each one is a scenario the player chooses inside the
# chat, and its narration is the first message of the conversation: it sets the
# scene and leaves the decision to them. The player is nobody in particular until
# they say who they are, and never the protagonist of the game unless they want to
# be.
#
# `id` is what a selection points at, so it is written down and not derived: it has
# to survive a rename of `name`, and a world forked from this template stores the id,
# not the index of the entry it came from.
#
# The games that have lore but no scenario to step into — Fallout 1, Fallout 2,
# Fallout Tactics, Shelter, Brotherhood of Steel — are not here at all. They are in
# the library below so the narrator can cite them, and they are not starts because
# there is nothing to begin from.
starts:
  - id: fallout-76
    name: Fallout 76
    game: fallout-76
    playable: true
    location: "Flatwoods"
    narration: >-
      Flatwoods, 2287. The saloon is quiet this morning. The proprietress is
      behind the counter, wiping a glass that has been clean for an hour, and
      the door has not moved in a while. Something is about to happen in here.

  - id: fallout-3
    name: Fallout 3
    game: fallout-3
    playable: true
    location: "Vault 101"
    narration: >-
      Vault 101, the same afternoon as always. The lights never change and the
      air has been recycled so long it tastes of itself. In the corridor outside
      the Overseer's office a man is waiting, and he has been waiting long enough
      to be annoyed about it.

  - id: new-vegas
    name: "Fallout: New Vegas"
    game: new-vegas
    playable: true
    location: "Goodsprings"
    narration: >-
      Goodsprings, the sun already high and the dust not yet settled. A courier
      is tying a horse to the rail outside the Prospector Saloon, and from
      somewhere behind the buildings a shot goes off. The street empties faster
      than it filled.

  - id: fallout-4
    name: Fallout 4
    game: fallout-4
    playable: true
    location: "Sanctuary"
    narration: >-
      Sanctuary Hills, 2287, the sirens not stopping. A vault door is open on the
      hill and nobody has come back through it. Below, the road out is blocked,
      and the people standing on the porches are deciding what to do about that.
